[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pirouette-dynamics"
version = "0.1.0"
description = "A physics-based simulator and learned controller for ballet pirouette turn stability"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "[YOUR NAME]" }]
keywords = ["biomechanics", "ballet", "pirouette", "rigid-body-dynamics", "reinforcement-learning"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
rl = ["gymnasium>=0.29", "torch>=2.0", "stable-baselines3>=2.0"]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
